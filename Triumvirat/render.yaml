services:
  - type: web
    name: triumvirat-backend
    runtime: docker
    rootDir: Triumvirat/backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/ping
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://triumvirat-backend.onrender.com
      - key: APP_KEY
        sync: false
      - key: FILESYSTEM_DISK
        value: s3
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_URL
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"

  - type: web
    name: triumvirat-frontend
    runtime: static
    rootDir: Triumvirat/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://triumvirat-backend.onrender.com
      - key: VITE_STORAGE_URL
        fromService:
          name: triumvirat-backend
          type: web
          envVarKey: AWS_URL